services:
  - type: web
    name: iitk-minecraft-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    autoDeploy: true
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: MINECRAFT_SERVER_IP
        sync: false
      - key: PORT
        value: 10000
